# Application
spring.application.name=sneaker-store-backend
server.port=8080
server.servlet.context-path=/

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sneaker_store
spring.datasource.username=postgres
spring.datasource.password=TIGER
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=ChangeThisToASecureSecretKeyOfAtLeast256BitsForProductionUse1234567890
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.prosneaker=DEBUG

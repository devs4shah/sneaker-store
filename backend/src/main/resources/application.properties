# Application
spring.application.name=sneaker-store-backend
server.port=8080
server.servlet.context-path=/

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sneaker_store
spring.datasource.username=postgres
spring.datasource.password=TIGER
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# JWT
app.jwt.secret=ChangeThisToASecureSecretKeyOfAtLeast256BitsForProductionUse1234567890
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# MVC - do not treat unknown API paths as static files
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Multipart upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Local image storage
app.storage.upload-dir=uploads
app.storage.max-file-size-bytes=5242880
app.storage.max-files-per-request=10
app.storage.allowed-content-types=image/jpeg,image/png,image/webp
app.storage.allowed-extensions=.jpg,.jpeg,.png,.webp
app.storage.public-url-prefix=/uploads

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.prosneaker=DEBUG


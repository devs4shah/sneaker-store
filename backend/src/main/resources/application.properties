# ===================================================================
# Base configuration (shared across all profiles)
#
# Secrets are read from environment variables. The :defaults shown here
# are convenience values for LOCAL development only. Production runs with
# SPRING_PROFILES_ACTIVE=prod which requires the env vars to be set
# (see application-prod.properties) and provides no insecure defaults.
# ===================================================================

# Application
spring.application.name=sneaker-store-backend
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Active profile (local by default, set SPRING_PROFILES_ACTIVE=prod in production)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Brevo SMTP (credentials supplied per-profile / via env)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:noreply@prosneaker.com}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/sneaker_store}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS - comma separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# MVC - do not treat unknown API paths as static files
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Multipart upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Local image storage
app.storage.upload-dir=${STORAGE_UPLOAD_DIR:uploads}
app.storage.max-file-size-bytes=5242880
app.storage.max-files-per-request=10
app.storage.allowed-content-types=image/jpeg,image/png,image/webp
app.storage.allowed-extensions=.jpg,.jpeg,.png,.webp
app.storage.public-url-prefix=/uploads

# Actuator - expose health endpoint for deployment platform probes
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when-authorized}
management.endpoint.health.probes.enabled=true

# Razorpay
razorpay.key=${RAZORPAY_KEY:}
razorpay.secret=${RAZORPAY_SECRET:}
razorpay.currency=${RAZORPAY_CURRENCY:}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.prosneaker=DEBUG

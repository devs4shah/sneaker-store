# ===================================================================
# Production profile  (activate with SPRING_PROFILES_ACTIVE=prod)
#
# Every value below is sourced from environment variables with NO
# fallback, so the application fails fast on boot if a required secret
# is missing instead of silently starting with insecure defaults.
# ===================================================================

# Application bind port (Railway sets PORT; local dev may use SERVER_PORT)
server.port=${PORT:${SERVER_PORT:8080}}

# Database (managed PostgreSQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate - never auto-mutate the schema destructively in prod
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (required)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Razorpay (required)
razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}
razorpay.currency=${RAZORPAY_CURRENCY:INR}

# Mail / Brevo (required)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM}

# CORS - must list the deployed frontend origin(s)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Persistent uploads directory (mount a volume here in production)
app.storage.upload-dir=${STORAGE_UPLOAD_DIR:/var/lib/prosneaker/uploads}

# Actuator
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}
management.endpoint.health.probes.enabled=true

# Logging - quieter, framework at WARN/INFO
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.org.springframework=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.prosneaker=${LOG_LEVEL_APP:INFO}
logging.file.name=${LOG_FILE:/var/log/prosneaker/backend.log}
